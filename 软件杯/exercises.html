<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习题库 - Scholar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body class="exercises-page">
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <div class="navbar-logo-icon">S</div>
        Scholar
      </a>
      <div class="navbar-nav">
        <a href="index.html" class="navbar-link">首页</a>
        <a href="learning-path.html" class="navbar-link">学习中心</a>
        <a href="resources.html" class="navbar-link">知识库</a>
        <a href="exercises.html" class="navbar-link active">练习</a>
        <a href="report.html" class="navbar-link">学习报告</a>
      </div>
      <div class="navbar-user">
        <div class="avatar" id="userAvatar">学</div>
      </div>
    </div>
  </nav>

  <main class="exercises-container">
    <div class="exercises-header">
      <h1>练习题库</h1>
      <p>巩固知识，检验学习成果</p>
    </div>

    <div class="knowledge-thread knowledge-thread-mini container">
      <svg viewBox="0 0 900 40" preserveAspectRatio="none">
        <defs>
          <linearGradient id="threadGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--primary)"/>
            <stop offset="50%" stop-color="var(--secondary)"/>
            <stop offset="100%" stop-color="var(--accent-green)"/>
          </linearGradient>
        </defs>
        <path class="thread-line" d="M30,20 C200,5 400,30 600,20 C750,12 820,28 870,20"/>
      </svg>
    </div>

    <div class="exercises-progress">
      <div class="exercises-progress-bar">
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
      <span class="exercises-progress-text" id="progressText">1 / 10</span>
    </div>

    <div class="question-card" id="questionCard" data-reveal="scale">
      <div class="question-type" id="questionType">单选题</div>
      <div class="question-text" id="questionText"></div>
      <div class="question-options" id="questionOptions"></div>
      <div class="question-actions">
        <button class="btn btn-secondary btn-sm" id="prevBtn">上一题</button>
        <button class="btn btn-primary btn-sm" id="nextBtn">下一题</button>
      </div>
    </div>

    <div id="resultHint" style="display: none; margin-top: 24px; padding: 20px; border-radius: 12px; text-align: center;">
      <p id="resultText" style="margin: 0; font-size: 1.125rem;"></p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Scholar</p>
      </div>
    </div>
  </footer>

  <script src="scripts/localStorage.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/scrollReveal.js"></script>
  <script>
    const questions = [
      {
        type: '单选题',
        question: '在机器学习中，以下哪种算法属于监督学习算法？',
        options: [
          { text: 'K-means聚类', value: 'A', correct: false },
          { text: '线性回归', value: 'B', correct: true },
          { text: '主成分分析PCA', value: 'C', correct: false },
          { text: '自编码器', value: 'D', correct: false }
        ]
      },
      {
        type: '单选题',
        question: '下列关于正则化的说法，错误的是？',
        options: [
          { text: 'L1正则化可以产生稀疏权重', value: 'A', correct: false },
          { text: 'L2正则化倾向于让权重接近零', value: 'B', correct: false },
          { text: '正则化可以防止过拟合', value: 'C', correct: false },
          { text: '正则化参数越大，模型越容易过拟合', value: 'D', correct: true }
        ]
      },
      {
        type: '单选题',
        question: '在梯度下降中，学习率过大可能导致？',
        options: [
          { text: '收敛速度变慢', value: 'A', correct: false },
          { text: '模型欠拟合', value: 'B', correct: false },
          { text: '震荡或发散', value: 'C', correct: true },
          { text: '梯度消失', value: 'D', correct: false }
        ]
      }
    ];

    let currentQuestion = 0;
    let selectedAnswer = null;

    document.addEventListener('DOMContentLoaded', () => {
      initCommonPage();

      if (!requireAuth()) return;

      const user = Storage.getUser();
      if (user && user.username) {
        document.getElementById('userAvatar').textContent = user.username.charAt(0);
      }

      const options = document.querySelectorAll('.question-option');
      options.forEach(option => {
        option.addEventListener('click', () => {
          options.forEach(o => o.classList.remove('selected'));
          option.classList.add('selected');
          const radio = option.querySelector('input');
          radio.checked = true;
          selectedAnswer = radio.value;
        });
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentQuestion < questions.length - 1) {
          currentQuestion++;
          loadQuestion();
        } else {
          showToast('恭喜你完成本轮练习！', 'success');
        }
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentQuestion > 0) {
          currentQuestion--;
          loadQuestion();
        }
      });
    });

    function loadQuestion() {
      const q = questions[currentQuestion];

      document.getElementById('questionType').textContent = q.type;
      document.getElementById('questionText').textContent = q.question;
      document.getElementById('progressText').textContent = `${currentQuestion + 1} / ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

      const optionsContainer = document.getElementById('questionOptions');
      optionsContainer.innerHTML = q.options.map(opt => `
        <label class="question-option">
          <input type="radio" name="answer" value="${opt.value}">
          <span>${opt.text}</span>
        </label>
      `).join('');

      const options = document.querySelectorAll('.question-option');
      options.forEach(option => {
        option.addEventListener('click', () => {
          options.forEach(o => o.classList.remove('selected'));
          option.classList.add('selected');
          const radio = option.querySelector('input');
          radio.checked = true;
          selectedAnswer = radio.value;
        });
      });

      document.getElementById('prevBtn').disabled = currentQuestion === 0;

      const resultHint = document.getElementById('resultHint');
      resultHint.style.display = 'none';
    }
  </script>
</body>
</html>
