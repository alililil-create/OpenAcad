<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习画像构建向导 - ML 教育平台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; color: #e0e0e0; }

  /* Progress Steps */
  .progress-bar-wrap { position: sticky; top: 0; z-index: 100; background: rgba(15,12,41,0.92); backdrop-filter: blur(10px); padding: 18px 20px 12px; border-bottom: 1px solid rgba(120,100,255,0.18); }
  .progress-steps { display: flex; justify-content: space-between; align-items: flex-start; max-width: 800px; margin: 0 auto; }
  .progress-steps .step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; cursor: default; }
  .progress-steps .step .circle { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 2.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.35); transition: all 0.35s; }
  .progress-steps .step.active .circle { border-color: #a78bfa; background: linear-gradient(135deg, #7c3aed, #a78bfa); color: #fff; box-shadow: 0 0 18px rgba(124,58,237,0.45); }
  .progress-steps .step.done .circle { border-color: #34d399; background: #34d399; color: #fff; }
  .progress-steps .step .label { font-size: 10px; margin-top: 5px; color: rgba(255,255,255,0.35); text-align: center; max-width: 70px; line-height: 1.3; transition: color 0.35s; }
  .progress-steps .step.active .label { color: #c4b5fd; }
  .progress-steps .step.done .label { color: #6ee7b7; }
  .progress-steps .step::after { content: ''; position: absolute; top: 18px; left: calc(50% + 22px); width: calc(100% - 44px); height: 2px; background: rgba(255,255,255,0.12); transition: background 0.35s; }
  .progress-steps .step:last-child::after { display: none; }
  .progress-steps .step.done::after { background: rgba(52,211,153,0.4); }

  /* Container */
  .wizard-container { max-width: 800px; margin: 0 auto; padding: 28px 20px 50px; }

  /* Stage Card */
  .stage-card { background: rgba(255,255,255,0.06); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 36px 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); animation: fadeSlideIn 0.45s ease; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .stage-card h2 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #c4b5fd, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .stage-card h3 { font-size: 17px; color: #c4b5fd; margin-bottom: 18px; font-weight: 500; }
  .stage-card p { line-height: 1.75; color: #b0b0c8; margin-bottom: 16px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.25s; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, #7c3aed, #a78bfa); color: #fff; box-shadow: 0 4px 16px rgba(124,58,237,0.35); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(124,58,237,0.5); }
  .btn-secondary { background: rgba(255,255,255,0.08); color: #c4b5fd; border: 1px solid rgba(167,139,250,0.3); }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }
  .btn-sm { padding: 7px 16px; font-size: 13px; border-radius: 7px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  /* Stage 0 Welcome */
  .welcome-icon { font-size: 56px; text-align: center; margin-bottom: 16px; }
  .info-box { background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.25); border-radius: 12px; padding: 16px 20px; margin: 18px 0; }

  /* Stage 1 Upload */
  .upload-zone { border: 2px dashed rgba(167,139,250,0.35); border-radius: 16px; padding: 50px 20px; text-align: center; cursor: pointer; transition: all 0.3s; background: rgba(255,255,255,0.03); }
  .upload-zone:hover, .upload-zone.dragover { border-color: #a78bfa; background: rgba(124,58,237,0.08); }
  .upload-zone .upload-icon { font-size: 44px; margin-bottom: 10px; }
  .upload-zone .upload-hint { color: #8888aa; font-size: 13px; margin-top: 6px; }
  .upload-zone.uploaded { border-color: rgba(52,211,153,0.45); border-style: solid; background: rgba(52,211,153,0.05); }
  .extracted-info { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.25); border-radius: 12px; padding: 16px 20px; margin-top: 18px; display: none; }
  .extracted-info h4 { color: #6ee7b7; margin-bottom: 8px; font-size: 14px; }
  .extracted-info pre { white-space: pre-wrap; font-size: 13px; color: #b0b0c8; line-height: 1.6; }
  .profile-agent-result { background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.25); border-radius: 12px; padding: 16px 20px; margin-top: 14px; display: none; }
  .profile-agent-result h4 { color: #c4b5fd; margin-bottom: 10px; font-size: 14px; }
  .profile-agent-result .agent-tag { display: inline-block; background: rgba(124,58,237,0.2); color: #a78bfa; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
  .profile-agent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .profile-agent-item { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 12px; }
  .profile-agent-item .label { font-size: 11px; color: #8888aa; }
  .profile-agent-item .value { font-size: 13px; color: #e0e0e0; font-weight: 500; }
  .skip-upload-btn { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 8px 16px; border-radius: 8px; background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #8888aa; font-size: 13px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .skip-upload-btn:hover { border-color: rgba(255,255,255,0.3); color: #b0b0c8; }

  /* Chat Profile (Stage 1B) */
  .chat-profile-container { display: flex; flex-direction: column; height: 450px; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; overflow: hidden; margin-top: 16px; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .chat-msg { display: flex; gap: 10px; max-width: 85%; animation: fadeSlideIn 0.3s ease; }
  .chat-msg.agent { align-self: flex-start; }
  .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .chat-msg .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .chat-msg.agent .avatar { background: rgba(124,58,237,0.2); }
  .chat-msg.user .avatar { background: rgba(167,139,250,0.3); }
  .chat-msg .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; }
  .chat-msg.agent .bubble { background: rgba(255,255,255,0.06); color: #d0d0e0; }
  .chat-msg.user .bubble { background: rgba(124,58,237,0.25); color: #e0e0e0; }
  .chat-input-area { display: flex; gap: 8px; padding: 12px 16px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.08); }
  .chat-input-area input { flex: 1; padding: 10px 14px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #e0e0e0; font-size: 14px; font-family: inherit; outline: none; }
  .chat-input-area input:focus { border-color: #a78bfa; }
  .chat-input-area button { padding: 10px 18px; border-radius: 8px; background: linear-gradient(135deg, #7c3aed, #a78bfa); color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; transition: all 0.2s; }
  .chat-input-area button:hover { box-shadow: 0 4px 12px rgba(124,58,237,0.35); }
  .chat-input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  .chat-typing { display: flex; align-items: center; gap: 4px; padding: 8px 12px; }
  .chat-typing span { width: 6px; height: 6px; border-radius: 50%; background: #a78bfa; animation: bounce 1.4s infinite; }
  .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
  .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); } 40% { transform: scale(1); } }

  /* Stage 2 Subject */
  .subject-card { background: rgba(167,139,250,0.08); border: 2px solid #a78bfa; border-radius: 14px; padding: 20px 24px; display: flex; align-items: center; gap: 16px; }
  .subject-card .check { font-size: 24px; color: #a78bfa; }
  .subject-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .subject-info .info-chip { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px 16px; text-align: center; }
  .subject-info .info-chip .num { font-size: 28px; font-weight: 800; color: #c4b5fd; }
  .subject-info .info-chip .txt { font-size: 12px; color: #8888aa; margin-top: 2px; }

  /* Stage 3 Quiz */
  .quiz-progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .quiz-progress-bar .fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #a78bfa); border-radius: 3px; transition: width 0.4s; }
  .quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 13px; color: #8888aa; }
  .quiz-meta .chapter-tag { background: rgba(124,58,237,0.2); color: #c4b5fd; padding: 3px 10px; border-radius: 6px; font-weight: 600; }
  .question-card { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 24px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 16px; }
  .question-card .q-text { font-size: 17px; line-height: 1.7; margin-bottom: 18px; color: #e0e0e0; }
  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { display: block; width: 100%; text-align: left; padding: 13px 18px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.12); color: #d0d0e0; font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: inherit; line-height: 1.5; }
  .option-btn:hover:not(.correct):not(.incorrect):not(.dont-know) { border-color: rgba(167,139,250,0.5); background: rgba(124,58,237,0.1); }
  .option-btn.correct { border-color: #34d399; background: rgba(52,211,153,0.15); color: #6ee7b7; }
  .option-btn.incorrect { border-color: #f87171; background: rgba(248,113,113,0.12); color: #fca5a5; }
  .option-btn.dont-know { border-color: rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: #8888aa; }
  .explanation-box { margin-top: 14px; padding: 14px 18px; border-radius: 10px; font-size: 14px; line-height: 1.6; display: none; }
  .explanation-box.correct-exp { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.2); color: #6ee7b7; }
  .explanation-box.incorrect-exp { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: #fca5a5; }
  .dont-know-btn { display: block; margin: 12px auto 0; padding: 10px 24px; border-radius: 8px; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #8888aa; font-size: 13px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .dont-know-btn:hover { border-color: rgba(255,255,255,0.3); color: #aaa; }
  .skip-notice { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.25); border-radius: 10px; padding: 12px 16px; margin-top: 14px; color: #fbbf24; font-size: 13px; display: none; }

  /* Stage 4 Generation */
  .loading-spinner { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 50px 20px; }
  .spinner { width: 52px; height: 52px; border: 4px solid rgba(167,139,250,0.2); border-top-color: #a78bfa; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: #c4b5fd; font-size: 15px; }
  .loading-sub { color: #8888aa; font-size: 13px; }
  .gen-steps { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .gen-step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #8888aa; }
  .gen-step.done { color: #6ee7b7; }
  .gen-step .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); }
  .gen-step.done .step-dot { background: #34d399; }

  /* Stage 5 Profile */
  .profile-chart { width: 100%; max-width: 400px; margin: 0 auto 24px; display: block; }
  .overall-score-bar { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; margin: 10px 0 20px; }
  .overall-score-bar .fill-bar { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #7c3aed, #a78bfa, #34d399); transition: width 0.6s; }
  .overall-label { display: flex; justify-content: space-between; font-size: 13px; color: #8888aa; margin-bottom: 4px; }
  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .weak-points-list, .strong-points-list { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 16px 18px; }
  .weak-points-list h4 { color: #fca5a5; margin-bottom: 10px; font-size: 14px; }
  .strong-points-list h4 { color: #6ee7b7; margin-bottom: 10px; font-size: 14px; }
  .weak-points-list ul, .strong-points-list ul { list-style: none; }
  .weak-points-list li, .strong-points-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
  .adj-btns { display: flex; gap: 4px; }
  .adj-btns button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer; font-size: 14px; line-height: 1; transition: all 0.2s; }
  .adj-btns button:hover { background: rgba(124,58,237,0.2); border-color: #a78bfa; }
  .score-val { font-weight: 700; color: #c4b5fd; min-width: 28px; text-align: center; }

  /* Stage 6 Final */
  .path-card { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 20px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; }
  .path-card h4 { color: #c4b5fd; margin-bottom: 8px; font-size: 15px; }
  .path-card .path-desc { font-size: 13px; color: #b0b0c8; line-height: 1.6; }
  .path-card .path-level { display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-left: 8px; }
  .path-level.beginner { background: rgba(52,211,153,0.15); color: #6ee7b7; }
  .path-level.intermediate { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .path-level.advanced { background: rgba(248,113,113,0.15); color: #fca5a5; }
  .done-icon { text-align: center; font-size: 60px; margin-bottom: 10px; }

  /* Responsive */
  @media (max-width: 600px) {
    .wizard-container { padding: 16px 12px 40px; }
    .stage-card { padding: 24px 18px; }
    .profile-grid { grid-template-columns: 1fr; }
    .subject-info { grid-template-columns: 1fr 1fr; }
    .progress-steps .step .label { font-size: 8px; max-width: 50px; }
    .progress-steps .step .circle { width: 28px; height: 28px; font-size: 11px; }
    .progress-steps .step::after { top: 14px; left: calc(50% + 18px); width: calc(100% - 36px); }
  }
</style>
</head>
<body>

<div class="progress-bar-wrap">
  <div class="progress-steps" id="progressSteps">
    <div class="step" data-stage="0"><div class="circle">1</div><div class="label">欢迎</div></div>
    <div class="step" data-stage="1"><div class="circle">2</div><div class="label">选择学科</div></div>
    <div class="step" data-stage="2"><div class="circle">3</div><div class="label">上传资料</div></div>
    <div class="step" data-stage="3"><div class="circle">4</div><div class="label">能力测评</div></div>
    <div class="step" data-stage="4"><div class="circle">5</div><div class="label">生成画像</div></div>
    <div class="step" data-stage="5"><div class="circle">6</div><div class="label">画像展示</div></div>
    <div class="step" data-stage="6"><div class="circle">7</div><div class="label">学习路径</div></div>
  </div>
</div>

<div class="wizard-container" id="wizardContainer"></div>

<script src="scripts/localStorage.js"></script>
  <script>
(function(){
  'use strict';

  /* ====== STATE ====== */
  const BASE_URL = () => localStorage.getItem('api_base_url') || 'http://127.0.0.1:8000';
  const USER_ID = () => Storage.getUserID();

  let currentStage = 0;
  let uploadedFile = null;
  let uploadedFileInfo = null;
  let llmProfileExtracted = null;
  let selectedSubject = 'machine_learning';
  let quizQuestions = [];
  let quizAnswers = [];
  let currentQuestionIndex = 0;
  let chapterCorrectCounts = {};
  let chapterRequiredCorrect = {};
  let chapterSkipped = {};
  let activeChapter = null;
  let capabilityMatrix = null;
  let profileAdjustments = {};
  let weakPointsData = [];
  let chatMessages = [];
  let chatProfileReady = false;

  var WIZARD_CHAPTERS = ['机器学习概述','数学基础','编程与数据处理','监督学习','无监督学习','神经网络基础','深度学习','模型评估','进阶方向'];
  var CHAPTER_ID_MAP = {
    '机器学习概述': 'ml_overview',
    '数学基础': 'math_foundation',
    '编程与数据处理': 'programming',
    '监督学习': 'supervised_learning',
    '无监督学习': 'unsupervised_learning',
    '神经网络基础': 'neural_networks',
    '深度学习': 'deep_learning',
    '模型评估': 'model_evaluation',
    '进阶方向': 'advanced_interest'
  };

  /* ====== DOM REF ====== */
  const container = document.getElementById('wizardContainer');
  const progressSteps = document.getElementById('progressSteps');

  /* ====== RENDER ====== */
  function updateProgress() {
    const steps = progressSteps.querySelectorAll('.step');
    steps.forEach(s => { s.classList.remove('active','done'); });
    for (let i = 0; i < steps.length; i++) {
      if (i < currentStage) steps[i].classList.add('done');
      if (i === currentStage) steps[i].classList.add('active');
    }
  }

  function renderStage() {
    updateProgress();
    switch (currentStage) {
      case 0: renderStageWelcome(); break;
      case 1: renderStageSubject(); break;
      case 2: renderStageUpload(); break;
      case 3: renderStageQuiz(); break;
      case 4: renderStageGenerate(); break;
      case 5: renderStageDisplay(); break;
      case 6: renderStagePath(); break;
    }
  }

  /* ====== STAGE 0: Welcome ====== */
  function renderStageWelcome() {
    container.innerHTML = `
      <div class="stage-card">
        <div class="welcome-icon">🧠</div>
        <h2>欢迎来到学习画像构建</h2>
        <p>为了给你推荐最合适的学习内容，需要你花 <strong style="color:#c4b5fd;">5-8 分钟</strong> 完成画像构建。</p>
        <div class="info-box">
          <p style="margin:0;font-size:14px;">📋 <strong>流程说明：</strong></p>
          <p style="margin:6px 0 0;font-size:13px;color:#b0b0c8;">选择学科 → 上传资料 → 能力测评 → 生成画像 → 查看画像 → 获取学习路径</p>
        </div>
        <div class="info-box" style="margin-top:12px;">
          <p style="margin:0;font-size:14px;">💡 <strong>温馨提示：</strong></p>
          <p style="margin:6px 0 0;font-size:13px;color:#b0b0c8;">测评环节共 15 道题，系统会根据你的答题情况自适应调整，不用担心，尽力作答即可。</p>
        </div>
        <div style="text-align:center;margin-top:24px;">
          <button class="btn btn-primary" onclick="window._wizard.goStage(1)">开始构建画像 →</button>
        </div>
      </div>`;
  }

  /* ====== STAGE 2: Document Upload + 画像构建Agent ====== */
  async function handleFile(file) {
    if (!file) return;
    const allowed = ['.txt','.pdf','.docx','.md'];
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    if (!allowed.includes(ext)) {
      alert('仅支持 .txt / .pdf / .docx / .md 格式文件');
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      alert('文件大小不能超过 20MB');
      return;
    }
    uploadedFile = file;
    uploadedFileInfo = { name: file.name, size: (file.size / 1024).toFixed(1) + ' KB', type: ext };
    llmProfileExtracted = null;
    renderStageUpload();

    const userId = USER_ID();
    if (!userId) { alert('请先登录'); return; }

    const formData = new FormData();
    formData.append('file', file);

    try {
      const resp = await apiCallForm('/api/wizard/upload-document/' + userId, formData);
      if (resp && resp.success) {
        uploadedFileInfo.extracted = resp.data?.extracted_info;
        if (resp.data?.profile_extracted && Object.keys(resp.data.profile_extracted).length > 0) {
          llmProfileExtracted = resp.data.profile_extracted;
        }
        renderStageUpload();
      }
    } catch(e) {
      console.warn('[Wizard] 上传文件失败:', e.message);
    }
  }

  function renderStageQuiz() {
    startQuiz();
  }

  function startQuiz() {
    quizQuestions = [...QUIZ_DATA];
    quizAnswers = [];
    currentQuestionIndex = 0;
    chapterCorrectCounts = {};
    chapterRequiredCorrect = {};
    chapterSkipped = {};
    const chapters = ['机器学习概述','数学基础','编程与数据处理','监督学习','无监督学习','神经网络基础','深度学习','模型评估','进阶方向'];
    chapters.forEach((ch, i) => {
      const chQs = quizQuestions.filter(q => q.chapterIdx === i);
      chapterRequiredCorrect[ch] = Math.min(2, chQs.length);
      chapterCorrectCounts[ch] = 0;
      chapterSkipped[ch] = false;
    });
    activeChapter = null;
    currentStage = 3;
    updateProgress();
    renderQuizQuestion();
  }

  function getCurrentValidQuestions() {
    return quizQuestions.filter(q => {
      if (activeChapter === null) return q.chapterIdx === quizQuestions[currentQuestionIndex]?.chapterIdx;
      return q.chapter === activeChapter;
    });
  }

  function getActiveChapterQuestions() {
    const ch = quizQuestions[currentQuestionIndex]?.chapter;
    if (!ch) return [];
    return quizQuestions.filter(q => q.chapter === ch);
  }

  function findNextQuestionIndex() {
    let idx = currentQuestionIndex + 1;
    while (idx < quizQuestions.length) {
      const q = quizQuestions[idx];
      if (!chapterSkipped[q.chapter]) return idx;
      idx++;
    }
    return -1;
  }

  function handleAnswer(questionId, selectedOption) {
    const q = quizQuestions.find(qq => qq.id === questionId);
    if (!q) return;
    const isCorrect = (selectedOption === q.correct);
    quizAnswers.push({ question_id: q.id, selected_option: selectedOption, is_correct: isCorrect });
    if (isCorrect) {
      chapterCorrectCounts[q.chapter] = (chapterCorrectCounts[q.chapter] || 0) + 1;
    }

    const chQs = quizQuestions.filter(qq => qq.chapter === q.chapter);
    const needed = chapterRequiredCorrect[q.chapter] || 2;

    if (chapterCorrectCounts[q.chapter] >= needed) {
      chapterSkipped[q.chapter] = true;
    }

    renderQuizQuestionWithAnswer(q, isCorrect);
  }

  function renderQuizQuestion() {
    if (currentQuestionIndex >= quizQuestions.length) {
      finishQuiz();
      return;
    }
    const q = quizQuestions[currentQuestionIndex];
    if (chapterSkipped[q.chapter]) {
      const next = findNextQuestionIndex();
      if (next >= 0) { currentQuestionIndex = next; renderQuizQuestion(); }
      else { finishQuiz(); }
      return;
    }
    activeChapter = q.chapter;

    const chQs = getActiveChapterQuestions();
    const answeredInCh = quizAnswers.filter(a => {
      const qq = quizQuestions.find(qqq => qqq.id === a.question_id);
      return qq && qq.chapter === q.chapter;
    }).length;
    const chTotal = chQs.length;
    const totalQs = quizQuestions.filter(qq => !chapterSkipped[qq.chapter]).length;
    const totalAnswered = quizAnswers.length;
    const progressPct = totalQs > 0 ? (totalAnswered / totalQs * 100) : 0;
    const needed = chapterRequiredCorrect[q.chapter] || 2;
    const chCorrect = chapterCorrectCounts[q.chapter] || 0;

    container.innerHTML = `
      <div class="stage-card">
        <h2>📝 能力测评</h2>
        <div class="quiz-progress-bar"><div class="fill" style="width:${progressPct}%;"></div></div>
        <div class="quiz-meta">
          <span class="chapter-tag">${q.chapter}</span>
          <span>第 ${totalAnswered + 1} / ${totalQs} 题 | 本章正确 ${chCorrect}/${needed}（达标后自动跳过）</span>
        </div>
        <div class="question-card" id="questionCard">
          <div class="q-text">${q.question}</div>
          <div class="options-list" id="optionsList">
            ${q.options.map((opt, i) => `<button class="option-btn" data-idx="${i}" onclick="window._wizard.handleAnswer('${q.id}', ${i})">${opt}</button>`).join('')}
          </div>
          <div class="explanation-box" id="explanationBox"></div>
          <button class="dont-know-btn" id="dontKnowBtn" onclick="window._wizard.handleDontKnow('${q.id}')">🤷 不知道</button>
          <div class="skip-notice" id="skipNotice"></div>
        </div>
        <div style="text-align:center;margin-top:16px;">
          <button class="btn btn-secondary btn-sm" id="btnNextQ" style="display:none;" onclick="window._wizard.nextQuestion()">下一题 →</button>
        </div>
      </div>`;
  }

  function renderQuizQuestionWithAnswer(q, isCorrect) {
    const opts = document.querySelectorAll('.option-btn');
    const expBox = document.getElementById('explanationBox');
    const btnNext = document.getElementById('btnNextQ');
    const dontKnowBtn = document.getElementById('dontKnowBtn');
    const skipNotice = document.getElementById('skipNotice');

    opts.forEach(btn => {
      btn.disabled = true;
      const idx = parseInt(btn.dataset.idx);
      if (idx === q.correct) btn.classList.add('correct');
      if (idx !== q.correct && btn.classList.contains('option-btn')) {
        if (idx === (quizAnswers[quizAnswers.length - 1]?.selected_option) && !isCorrect) {
          btn.classList.add('incorrect');
        }
      }
    });

    if (dontKnowBtn) dontKnowBtn.style.display = 'none';
    if (expBox) {
      expBox.style.display = 'block';
      expBox.className = 'explanation-box ' + (isCorrect ? 'correct-exp' : 'incorrect-exp');
      expBox.textContent = (isCorrect ? '✅ 正确！' : '❌ 不正确。') + ' ' + q.explanation;
    }

    if (chapterSkipped[q.chapter] && skipNotice) {
      skipNotice.style.display = 'block';
      skipNotice.textContent = `🎉 本章已达正确数量要求（${chapterCorrectCounts[q.chapter]} / ${chapterRequiredCorrect[q.chapter]}），剩下题目将自动跳过！`;
    }

    if (btnNext) btnNext.style.display = 'inline-flex';
  }

  function handleDontKnow(questionId) {
    const q = quizQuestions.find(qq => qq.id === questionId);
    if (!q) return;
    quizAnswers.push({ question_id: q.id, selected_option: -1, is_correct: false });
    renderQuizQuestionWithAnswer(q, false);
  }

  function nextQuestion() {
    let next = findNextQuestionIndex();
    if (next < 0) {
      finishQuiz();
      return;
    }
    currentQuestionIndex = next;
    renderQuizQuestion();
  }

  function finishQuiz() {
    currentStage = 4;
    updateProgress();
    renderStageGenerate();
  }

  /* ====== STAGE 4: Profile Generation ====== */
  function renderStageGenerate() {
    container.innerHTML = `
      <div class="stage-card">
        <h2>🔄 正在生成学习画像</h2>
        <div class="loading-spinner">
          <div class="spinner"></div>
          <div class="loading-text">系统正在合并测评结果与暂存的画像数据...</div>

          <div class="gen-steps" id="genSteps">
            <div class="gen-step" id="gs0"><span class="step-dot"></span> 分析答题情况</div>
            <div class="gen-step" id="gs1"><span class="step-dot"></span> 评估各章节掌握度</div>
            <div class="gen-step" id="gs2"><span class="step-dot"></span> 合并暂存画像数据</div>
            <div class="gen-step" id="gs3"><span class="step-dot"></span> 生成能力矩阵</div>
            <div class="gen-step" id="gs4"><span class="step-dot"></span> 识别强项与薄弱点</div>
            <div class="gen-step" id="gs5"><span class="step-dot"></span> 计算综合评分</div>
          </div>
        </div>
      </div>`;

    const steps = [
      { el: 'gs0', delay: 80 },
      { el: 'gs1', delay: 160 },
      { el: 'gs2', delay: 240 },
      { el: 'gs3', delay: 320 },
      { el: 'gs4', delay: 400 },
      { el: 'gs5', delay: 480 }
    ];

    steps.forEach(({ el, delay }) => {
      setTimeout(() => {
        const elem = document.getElementById(el);
        if (elem) elem.classList.add('done');
      }, delay);
    });

    setTimeout(() => {
      generateProfile();
    }, 600);
  }

  function generateProfile() {
    // Compute capability matrix from quiz answers
    const chapters = WIZARD_CHAPTERS;
    capabilityMatrix = {};
    chapters.forEach(ch => {
      const chQs = quizQuestions.filter(q => q.chapter === ch);
      const chAnswers = quizAnswers.filter(a => {
        const q = quizQuestions.find(qq => qq.id === a.question_id);
        return q && q.chapter === ch;
      });
      const correct = chAnswers.filter(a => a.is_correct).length;
      const total = chQs.length;
      const score = total > 0 ? Math.round((correct / total) * 100) : 50;
      capabilityMatrix[ch] = Math.min(100, Math.max(20, score));
    });

    profileAdjustments = {};
    chapters.forEach(ch => { profileAdjustments[ch] = 0; });

    currentStage = 5;
    updateProgress();
    renderStageDisplay();
  }

  /* ====== STAGE 5: Profile Display ====== */
  function renderStageDisplay() {
    const chapters = WIZARD_CHAPTERS;
    const scores = chapters.map(ch => capabilityMatrix[ch] || 50);
    const overall = Math.round(scores.reduce((a,b) => a + b, 0) / scores.length);
    const sorted = chapters.map(ch => ({ name: ch, score: capabilityMatrix[ch] || 50 })).sort((a,b) => b.score - a.score);
    const strongPoints = sorted.slice(0, 3);
    const weakPoints = sorted.slice(-3).reverse();

    container.innerHTML = `
      <div class="stage-card">
        <h2>📊 学习能力画像</h2>
        <p>基于你的测评结果生成的各章节能力分布：</p>
        <div class="profile-chart">
          <canvas id="radarCanvas" width="400" height="400"></canvas>
        </div>
        <div class="overall-label"><span>综合评分</span><span style="color:#c4b5fd;font-weight:700;">${overall} / 100</span></div>
        <div class="overall-score-bar"><div class="fill-bar" style="width:${overall}%;"></div></div>
        <div class="profile-grid">
          <div class="weak-points-list">
            <h4>⚠️ 薄弱环节</h4>
            <ul id="weakList"></ul>
          </div>
          <div class="strong-points-list">
            <h4>⭐ 优势领域</h4>
            <ul id="strongList"></ul>
          </div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;">
          <button class="btn btn-secondary" onclick="window._wizard.goStage(3)">← 重新测评</button>
          <button class="btn btn-primary" onclick="window._wizard.confirmProfile()">确认画像 →</button>
        </div>
      </div>`;

    setTimeout(() => drawRadarChart(scores, chapters), 100);
    setTimeout(() => {
      renderWeakStrongList('weakList', weakPoints, true);
      renderWeakStrongList('strongList', strongPoints, false);
    }, 150);
  }

  function renderWeakStrongList(listId, items, isWeak) {
    const list = document.getElementById(listId);
    if (!list) return;
    list.innerHTML = items.map((item, idx) => {
      const adj = profileAdjustments[item.name] || 0;
      return `<li>
        <span>${item.name}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="score-val">${Math.min(100, Math.max(1, item.score + adj))}</span>
          <div class="adj-btns">
            <button onclick="window._wizard.adjustProfile('${item.name}', -1)">−</button>
            <button onclick="window._wizard.adjustProfile('${item.name}', 1)">+</button>
          </div>
        </div>
      </li>`;
    }).join('');
  }

  function adjustProfile(chapterName, delta) {
    if (!profileAdjustments[chapterName]) profileAdjustments[chapterName] = 0;
    profileAdjustments[chapterName] += delta;
    const newVal = (capabilityMatrix[chapterName] || 50) + profileAdjustments[chapterName];
    if (newVal < 1 || newVal > 100) {
      profileAdjustments[chapterName] -= delta;
      return;
    }
    renderStageDisplay();
  }

  function drawRadarChart(scores, labels) {
    const canvas = document.getElementById('radarCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2;
    const radius = 140;
    const n = labels.length;

    ctx.clearRect(0, 0, w, h);

    // Background grid
    for (let r = 1; r <= 5; r++) {
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        const x = cx + (radius / 5) * r * Math.cos(angle);
        const y = cy + (radius / 5) * r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.stroke();
    }

    // Axis lines
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.stroke();
    }

    // Data polygon
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      const val = scores[i] / 100;
      const x = cx + radius * val * Math.cos(angle);
      const y = cy + radius * val * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(124,58,237,0.2)';
    ctx.fill();
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Data points
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      const val = scores[i] / 100;
      const x = cx + radius * val * Math.cos(angle);
      const y = cy + radius * val * Math.sin(angle);
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#c4b5fd';
      ctx.fill();
    }

    // Labels
    ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#c4b5fd';
    ctx.textAlign = 'center';
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      const labelR = radius + 32;
      const x = cx + labelR * Math.cos(angle);
      const y = cy + labelR * Math.sin(angle);
      // Short labels
      const short = labels[i].length > 4 ? labels[i].substring(0, 3) + '..' : labels[i];
      ctx.fillText(short, x, y + 5);
    }
  }

  let confirmingProfile = false;

  async function confirmProfile() {
    // 防止重复点击
    if (confirmingProfile) return;
    confirmingProfile = true;

    const chapters = WIZARD_CHAPTERS;
    // 将调整后的评分传给后端合并生成完整画像（转为后端 chapter_id）
    const adjustedMatrix = {};
    chapters.forEach(ch => {
      adjustedMatrix[ch] = Math.min(100, Math.max(1, (capabilityMatrix[ch] || 50) + (profileAdjustments[ch] || 0)));
    });

    // 更新 capabilityMatrix 为调整后的值（用于后续学习路径展示）
    chapters.forEach(ch => { capabilityMatrix[ch] = adjustedMatrix[ch]; });

    // 转换为后端 chapter_id 格式
    const adjustedMatrixById = {};
    chapters.forEach(ch => {
      var chId = CHAPTER_ID_MAP[ch] || ch;
      adjustedMatrixById[chId] = adjustedMatrix[ch];
    });

    weakPointsData = chapters
      .map(ch => ({ chapter: ch, score: adjustedMatrix[ch] }))
      .filter(item => item.score < 60)
      .sort((a, b) => a.score - b.score);
    currentStage = 6;
    updateProgress();
    renderStagePath();

    // 使用 requestAnimationFrame 确保 UI 先渲染再发起后台请求
    requestAnimationFrame(() => {
      setTimeout(async () => {
        const userId = USER_ID();
        if (userId) {
          try {
            const resp = await apiCall('POST', '/api/wizard/combine-and-generate-profile/' + userId, {
              capability_matrix: adjustedMatrixById,
              quiz_answers: quizAnswers
            });
            if (resp && resp.success) {
              console.log('[Wizard] 合并画像生成完成:', resp.data);
            }
          } catch(e) {
            console.warn('[Wizard] 合并画像生成失败:', e.message);
          }
        }
        confirmingProfile = false;
      }, 0);
    });
  }

  /* ====== STAGE 6: Final ====== */
  function renderStagePath() {
    const pathItems = generateLearningPath();
    container.innerHTML = `
      <div class="stage-card">
        <div class="done-icon">🎓</div>
        <h2>你的专属学习路径</h2>
        <p>基于你的薄弱环节，系统为你推荐以下学习路径：</p>
        <div id="pathList"></div>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;">
          <button class="btn btn-secondary" onclick="window._wizard.goStage(5)">← 返回画像</button>
          <button class="btn btn-primary" onclick="window._wizard.finishWizard()">完成，开始学习！</button>
        </div>
      </div>`;

    const pathList = document.getElementById('pathList');
    if (pathList) {
      pathList.innerHTML = pathItems.map(p => `
        <div class="path-card">
          <h4>${p.order}. ${p.chapter} <span class="path-level ${p.level}">${p.levelLabel}</span></h4>
          <div class="path-desc">${p.description}</div>
        </div>`).join('');
    }
  }

  function generateLearningPath() {
    const chapters = WIZARD_CHAPTERS;
    const all = chapters.map(ch => ({
      chapter: ch,
      score: (capabilityMatrix[ch] || 50) + (profileAdjustments[ch] || 0)
    })).sort((a, b) => a.score - b.score);

    const descriptions = {
      '机器学习概述': '回顾机器学习的基本概念、类型和应用场景，构建完整知识框架。',
      '线性回归': '深入理解线性模型原理、梯度下降优化和正则化方法。',
      '逻辑回归': '掌握分类问题的建模方法、Sigmoid 函数和决策边界。',
      '决策树': '学习树模型的分裂策略、剪枝技术和特征重要性分析。',
      '支持向量机': '理解最大间隔分类、核技巧和软间隔 SVM 的原理。',
      '神经网络': '从感知机到深度网络，掌握前向传播和反向传播机制。',
      '集成学习': '学习 Bagging、Boosting 和 Stacking 等集成策略及实践。'
    };

    return all.map((item, idx) => {
      let level, levelLabel;
      if (item.score < 40) { level = 'beginner'; levelLabel = '入门'; }
      else if (item.score < 70) { level = 'intermediate'; levelLabel = '进阶'; }
      else { level = 'advanced'; levelLabel = '高级'; }
      return {
        order: idx + 1,
        chapter: item.chapter,
        score: item.score,
        level: level,
        levelLabel: levelLabel,
        description: (idx < 3 && item.score < 70) ? '⭐ 重点学习：' + descriptions[item.chapter] : descriptions[item.chapter]
      };
    });
  }

  async function finishWizard() {
    // 调用后端 API 保存画像到数据库（转为后端 chapter_id 格式）
    const userId = USER_ID();
    if (userId && capabilityMatrix) {
      try {
        var matrixById = {};
        WIZARD_CHAPTERS.forEach(function(ch) {
          var chId = CHAPTER_ID_MAP[ch] || ch;
          matrixById[chId] = capabilityMatrix[ch] || 50;
        });
        const resp = await apiCall('POST', `/api/wizard/save-computed-profile/${userId}`, {
          capability_matrix: matrixById,
          quiz_answers: quizAnswers
        });
        if (resp && resp.success) {
          console.log('[Wizard] 画像已保存到数据库:', resp.data);
        }
      } catch(e) {
        console.warn('[Wizard] 画像保存失败:', e.message);
      }
    }

    container.innerHTML = `
      <div class="stage-card" style="text-align:center;">
        <div class="done-icon">✨</div>
        <h2>画像构建完成！</h2>
        <p>你的学习画像已保存，即将跳转到学习页面...</p>
        <p style="font-size:13px;color:#8888aa;">如果页面未自动跳转，请点击下方按钮。</p>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="window.location.href='index.html'">前往学习首页</button>
      </div>`;
    currentStage = 7;
    updateProgress();
    setTimeout(() => {
      if (currentStage === 7) {
        window.location.href = 'index.html';
      }
    }, 3000);
  }

  /* ====== NAVIGATION ====== */
  function goStage(stage) {
    currentStage = stage;
    renderStage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ====== 对话式画像构建 (Stage 1B: Chat Profile Building) ====== */
  let chatStage = 'intro'; // intro / chatting / generating / done

  function startChatProfile() {
    chatMessages = [];
    chatProfileReady = false;
    chatStage = 'intro';
    renderChatProfile();
  }

  function renderChatProfile() {
    if (chatStage === 'intro') {
      container.innerHTML = `
        <div class="stage-card">
          <h2>💬 画像构建Agent - 对话式画像构建</h2>
          <p>没有文档？没关系！与画像构建Agent进行一次简短的对话，它会从对话中提取你的专业、年级、知识基础、学习风格、目标等关键信息。</p>
          <div class="info-box">
            <p style="margin:0;font-size:14px;">🤖 <strong>Agent 将询问以下信息：</strong></p>
            <p style="margin:6px 0 0;font-size:13px;color:#b0b0c8;">专业/年级 → 已修课程 → 技能水平 → 学习目标 → 学习风格偏好 → 薄弱点</p>
          </div>
          <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;">
            <button class="btn btn-secondary" onclick="window._wizard.goStage(2)">← 返回上传</button>
            <button class="btn btn-primary" onclick="window._wizard.beginChatProfile()">开始对话 →</button>
          </div>
        </div>`;
    } else if (chatStage === 'chatting' || chatStage === 'generating') {
      renderChatInterface();
    } else if (chatStage === 'done') {
      renderChatProfileDone();
    }
  }

  function renderChatInterface() {
    container.innerHTML = `
      <div class="stage-card">
        <h2>💬 画像构建Agent</h2>
        <p style="font-size:13px;color:#8888aa;">与画像构建Agent对话，让它了解你的学习背景</p>
        <div class="chat-profile-container">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-area" id="chatInputArea">
            <input type="text" id="chatInput" placeholder="输入你的回答..." onkeydown="if(event.key==='Enter')window._wizard.sendChatMessage()">
            <button id="chatSendBtn" onclick="window._wizard.sendChatMessage()">发送</button>
          </div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:14px;">
          <button class="btn btn-secondary" onclick="window._wizard.goStage(2)">← 返回上传</button>
          
        </div>
      </div>`;

    renderChatMessages();

    if (chatStage === 'generating') {
      disableChatInput(true);
      showTypingIndicator();
    }
  }

  function renderChatMessages() {
    const msgsEl = document.getElementById('chatMessages');
    if (!msgsEl) return;
    const iconAgent = '🤖';
    const iconUser = '👤';
    msgsEl.innerHTML = chatMessages.map(m => `
      <div class="chat-msg ${m.role}">
        <div class="avatar">${m.role === 'agent' ? iconAgent : iconUser}</div>
        <div class="bubble">${escapeHtml(m.content)}</div>
      </div>`).join('');

    if (chatStage === 'generating') {
      showTypingIndicator();
    }

    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function showTypingIndicator() {
    const msgsEl = document.getElementById('chatMessages');
    if (!msgsEl) return;
    const typingEl = document.createElement('div');
    typingEl.className = 'chat-msg agent';
    typingEl.id = 'typingIndicator';
    typingEl.innerHTML = '<div class="avatar">🤖</div><div class="chat-typing"><span></span><span></span><span></span></div>';
    msgsEl.appendChild(typingEl);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function disableChatInput(disabled) {
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('chatSendBtn');
    if (input) input.disabled = disabled;
    if (btn) btn.disabled = disabled;
  }

  async function beginChatProfile() {
    chatMessages = [{ role: 'agent', content: '你好！我是你的画像构建助手 🤖 为了更好地为你推荐学习内容，我想了解你的学习背景。\n\n首先，能告诉我你的专业和年级吗？' }];
    chatStage = 'chatting';
    renderChatProfile();
  }

  async function sendChatMessage() {
    const input = document.getElementById('chatInput');
    if (!input || !input.value.trim()) return;

    const userMsg = input.value.trim();
    input.value = '';
    input.focus();

    chatMessages.push({ role: 'user', content: userMsg });
    renderChatMessages();
    disableChatInput(true);

    showTypingIndicator();

    const userId = USER_ID();
    if (!userId) {
      removeTypingIndicator();
      chatMessages.push({ role: 'agent', content: '请先登录后再进行对话。' });
      renderChatMessages();
      disableChatInput(false);
      return;
    }

    try {
      const apiMessages = chatMessages.map(m => ({ role: m.role, content: m.content }));
      const resp = await apiCall('POST', '/api/wizard/chat-profile/' + userId, { messages: apiMessages });
      removeTypingIndicator();

      if (resp && resp.success) {
        const reply = resp.data?.reply || '好的，我了解了。请继续告诉我更多信息。';
        chatMessages.push({ role: 'agent', content: reply });

        if (resp.data?.profile_ready) {
          chatStage = 'chatting';
          chatMessages.push({ role: 'agent', content: '✅ 我已经收集了足够的信息！正在为你保存这些数据，它们将在能力测评后（阶段5）合并生成完整画像。' });
          renderChatProfile();
          setTimeout(() => generateChatProfileResult(), 500);
          return;
        }
      } else {
        chatMessages.push({ role: 'agent', content: '抱歉，网络似乎有些问题。请稍后重试或返回上传文档。' });
      }
    } catch(e) {
      removeTypingIndicator();
      console.warn('[ChatProfile] 对话失败:', e.message);
      chatMessages.push({ role: 'agent', content: '抱歉，连接出现了问题。你可以先返回上传文档页面。' });
    }

    renderChatProfile();
  }

  async function generateChatProfileResult() {
    chatStage = 'generating';
    renderChatProfile();
    disableChatInput(true);

    const userId = USER_ID();
    if (!userId) return;

    try {
      const apiMessages = chatMessages.filter(m => m.content && !m.content.startsWith('✅')).map(m => ({ role: m.role, content: m.content }));
      const resp = await apiCall('POST', '/api/wizard/generate-chat-profile/' + userId, { messages: apiMessages });
      removeTypingIndicator();

      if (resp && resp.success) {
        llmProfileExtracted = resp.data?.profile;
        chatStage = 'done';
      } else {
        chatStage = 'chatting';
        chatMessages.push({ role: 'agent', content: '画像生成遇到了一些问题，请再提供一些信息。' });
      }
    } catch(e) {
      removeTypingIndicator();
      console.warn('[ChatProfile] 生成画像失败:', e.message);
      chatStage = 'chatting';
      chatMessages.push({ role: 'agent', content: '抱歉，生成画像时出错了。你可以先返回上传文档页面。' });
    }

    renderChatProfile();
  }

  function renderChatProfileDone() {
    let profileHtml = '';
    if (llmProfileExtracted) {
      const p = llmProfileExtracted;
      profileHtml = `
        <div class="profile-agent-result" style="display:block;">
          <span class="agent-tag">🤖 画像构建Agent 已提取</span>
          <h4>📊 通过对话提取的画像数据</h4>
          <div class="profile-agent-grid">
            <div class="profile-agent-item"><div class="label">专业</div><div class="value">${p.major || '未识别'}</div></div>
            <div class="profile-agent-item"><div class="label">年级</div><div class="value">${p.grade_level || '未识别'}</div></div>
            <div class="profile-agent-item"><div class="label">目标职业</div><div class="value">${p.target_role || '未识别'}</div></div>
            <div class="profile-agent-item"><div class="label">置信度</div><div class="value">${p.confidence_score ? Math.round(p.confidence_score * 100) + '%' : 'N/A'}</div></div>
          </div>
          <p style="font-size:12px;color:#8888aa;margin-top:10px;">💡 数据已暂存，将在能力测评后（阶段5）合并生成完整画像。</p>
        </div>`;
    }

    container.innerHTML = `
      <div class="stage-card">
        <h2>✅ 信息收集完成</h2>
        <p>画像构建Agent 已通过对话提取了你的关键特征，数据已暂存。完成能力测评后，系统将在阶段5合并生成完整画像。</p>
        <div class="chat-profile-container" style="height:250px;">
          <div class="chat-messages" id="chatMessagesDone"></div>
        </div>
        ${profileHtml}
        <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;">
          <button class="btn btn-secondary" onclick="window._wizard.startChatProfile()">↺ 重新对话</button>
          <button class="btn btn-secondary" onclick="window._wizard.goStage(2)">← 返回上传资料</button>
          <button class="btn btn-primary" onclick="window._wizard.startQuiz()">进入能力测评 →</button>
        </div>
      </div>`;

    const msgsEl = document.getElementById('chatMessagesDone');
    if (msgsEl) {
      const recentMsgs = chatMessages.slice(-8);
      msgsEl.innerHTML = recentMsgs.map(m => `
        <div class="chat-msg ${m.role}">
          <div class="avatar">${m.role === 'agent' ? '🤖' : '👤'}</div>
          <div class="bubble">${escapeHtml(m.content)}</div>
        </div>`).join('');
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  /* ====== API ====== */
  async function apiCall(method, path, body = null) {
    const url = BASE_URL() + path;
    const opts = {
      method,
      headers: body instanceof FormData ? {} : { 'Content-Type': 'application/json' },
      body: body instanceof FormData ? body : (body ? JSON.stringify(body) : undefined)
    };
    try {
      const resp = await fetch(url, opts);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return await resp.json();
    } catch (err) {
      console.warn('API call failed:', err.message, '- using local fallback');
      return null;
    }
  }

  async function apiCallForm(path, formData) {
    const url = BASE_URL() + path;
    try {
      const resp = await fetch(url, { method: 'POST', body: formData });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return await resp.json();
    } catch (err) {
      console.warn('API form call failed:', err.message);
      return null;
    }
  }

  /* ====== EXPORT ====== */
  window._wizard = {
    goStage,
    startQuiz,
    handleAnswer,
    handleDontKnow,
    nextQuestion,
    adjustProfile,
    confirmProfile,
    finishWizard,
    startChatProfile,
    beginChatProfile,
    sendChatMessage,
    generateChatProfileResult
  };

  /* ====== INIT ====== */
  renderStage();

})();
</script>
