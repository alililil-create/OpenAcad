<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI画像收集 - 机器学习个性化智能学习平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body class="profile-page">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <div class="navbar-logo-icon">🤖</div>
        <span>ML智能学习</span>
      </a>
    </div>
  </nav>

  <!-- 主内容 -->
  <div class="profile-container">
    <div class="profile-header">
      <h1>🎯 创建你的学习画像</h1>
      <p>AI将根据你的情况定制专属学习路径</p>
    </div>

    <!-- 进度指示 -->
    <div class="profile-progress">
      <div class="profile-progress-bar">
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
      <span class="profile-progress-text" id="progressText">0 / 8</span>
    </div>

    <!-- AI对话区域 -->
    <div class="chat-container" id="chatContainer">
      <!-- 消息将动态插入 -->
    </div>
  </div>

  <!-- 脚本 -->
  <script src="scripts/localStorage.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/profile.js"></script>
</body>
</html>
