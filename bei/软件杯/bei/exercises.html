<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习题库 - 机器学习个性化智能学习平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body class="exercises-page">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <div class="navbar-logo-icon">🤖</div>
        <span>ML智能学习</span>
      </a>
      <div class="navbar-nav">
        <a href="index.html" class="navbar-link">首页</a>
        <a href="learning-path.html" class="navbar-link">学习中心</a>
        <a href="resources.html" class="navbar-link">知识库</a>
        <a href="exercises.html" class="navbar-link active">练习</a>
        <a href="report.html" class="navbar-link">学习报告</a>
      </div>
      <div class="navbar-user">
        <div class="avatar" id="userAvatar">学</div>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <div class="exercises-container">
    <div class="exercises-header">
      <h1>📝 练习题库</h1>
      <p>检验学习成果，巩固知识点</p>
    </div>

    <!-- 进度指示 -->
    <div class="exercises-progress">
      <div class="exercises-progress-bar">
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progressFill" style="width: 30%"></div>
        </div>
      </div>
      <span class="exercises-progress-text" id="progressText">3 / 10</span>
    </div>

    <!-- 题目卡片 -->
    <div class="question-card" id="questionCard">
      <span class="question-type" id="questionType">单选题</span>
      <p class="question-text" id="questionText">
        在机器学习中，以下哪种算法属于监督学习算法？
      </p>
      <div class="question-options" id="questionOptions">
        <label class="question-option">
          <input type="radio" name="answer" value="A">
          <span>K-means聚类</span>
        </label>
        <label class="question-option">
          <input type="radio" name="answer" value="B">
          <span>线性回归</span>
        </label>
        <label class="question-option">
          <input type="radio" name="answer" value="C">
          <span>主成分分析PCA</span>
        </label>
        <label class="question-option">
          <input type="radio" name="answer" value="D">
          <span>自编码器</span>
        </label>
      </div>
      <div class="question-actions">
        <button class="btn btn-ghost" id="prevBtn" disabled>← 上一题</button>
        <button class="btn btn-primary" id="nextBtn">下一题 →</button>
      </div>
    </div>

    <!-- 答题结果提示 -->
    <div id="resultHint" style="display: none; margin-top: 24px; padding: 20px; border-radius: 12px; text-align: center;">
      <p id="resultText" style="margin: 0; font-size: 1.125rem;"></p>
    </div>

    <!-- 题目导航 -->
    <div style="margin-top: 32px;">
      <h3 style="margin-bottom: 16px; font-size: 1rem; color: var(--text-secondary);">题目导航</h3>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="questionNav">
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0;">1</button>
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0;">2</button>
        <button class="btn btn-sm btn-primary" style="width: 40px; height: 40px; padding: 0;">3</button>
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0; opacity: 0.5;" disabled>4</button>
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0; opacity: 0.5;" disabled>5</button>
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0; opacity: 0.5;" disabled>6</button>
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0; opacity: 0.5;" disabled>7</button>
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0; opacity: 0.5;" disabled>8</button>
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0; opacity: 0.5;" disabled>9</button>
        <button class="btn btn-sm" style="width: 40px; height: 40px; padding: 0; opacity: 0.5;" disabled>10</button>
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 ML智能学习平台 - 第十五届中国软件杯参赛作品</p>
      </div>
    </div>
  </footer>

  <!-- 脚本 -->
  <script src="scripts/localStorage.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    // 题目数据
    const questions = [
      {
        type: '单选题',
        question: '在机器学习中，以下哪种算法属于监督学习算法？',
        options: [
          { text: 'K-means聚类', value: 'A', correct: false },
          { text: '线性回归', value: 'B', correct: true },
          { text: '主成分分析PCA', value: 'C', correct: false },
          { text: '自编码器', value: 'D', correct: false }
        ]
      },
      {
        type: '单选题',
        question: '下列关于正则化的说法，错误的是？',
        options: [
          { text: 'L1正则化可以产生稀疏权重', value: 'A', correct: false },
          { text: 'L2正则化倾向于让权重接近零', value: 'B', correct: false },
          { text: '正则化可以防止过拟合', value: 'C', correct: false },
          { text: '正则化参数越大，模型越容易过拟合', value: 'D', correct: true }
        ]
      },
      {
        type: '单选题',
        question: '在梯度下降中，学习率过大可能导致？',
        options: [
          { text: '收敛速度变慢', value: 'A', correct: false },
          { text: '模型欠拟合', value: 'B', correct: false },
          { text: '震荡或发散', value: 'C', correct: true },
          { text: '梯度消失', value: 'D', correct: false }
        ]
      }
    ];

    let currentQuestion = 0;
    let selectedAnswer = null;

    document.addEventListener('DOMContentLoaded', () => {
      initCommonPage();

      if (!requireAuth()) return;

      const user = Storage.getUser();
      if (user && user.username) {
        document.getElementById('userAvatar').textContent = user.username.charAt(0);
      }

      // 选项点击事件
      const options = document.querySelectorAll('.question-option');
      options.forEach(option => {
        option.addEventListener('click', () => {
          // 移除其他选中状态
          options.forEach(o => o.classList.remove('selected'));
          // 添加选中状态
          option.classList.add('selected');
          // 记录答案
          const radio = option.querySelector('input');
          radio.checked = true;
          selectedAnswer = radio.value;
        });
      });

      // 下一题按钮
      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentQuestion < questions.length - 1) {
          currentQuestion++;
          loadQuestion();
        } else {
          showToast('恭喜你完成本轮练习！', 'success');
        }
      });

      // 上一题按钮
      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentQuestion > 0) {
          currentQuestion--;
          loadQuestion();
        }
      });
    });

    function loadQuestion() {
      const q = questions[currentQuestion];

      document.getElementById('questionType').textContent = q.type;
      document.getElementById('questionText').textContent = q.question;
      document.getElementById('progressText').textContent = `${currentQuestion + 1} / ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

      const optionsContainer = document.getElementById('questionOptions');
      optionsContainer.innerHTML = q.options.map(opt => `
        <label class="question-option">
          <input type="radio" name="answer" value="${opt.value}">
          <span>${opt.text}</span>
        </label>
      `).join('');

      // 重新绑定点击事件
      const options = document.querySelectorAll('.question-option');
      options.forEach(option => {
        option.addEventListener('click', () => {
          options.forEach(o => o.classList.remove('selected'));
          option.classList.add('selected');
          const radio = option.querySelector('input');
          radio.checked = true;
          selectedAnswer = radio.value;
        });
      });

      // 更新按钮状态
      document.getElementById('prevBtn').disabled = currentQuestion === 0;

      // 清空结果提示
      const resultHint = document.getElementById('resultHint');
      resultHint.style.display = 'none';
    }
  </script>
</body>
</html>
