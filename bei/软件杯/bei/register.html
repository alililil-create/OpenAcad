<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 机器学习个性化智能学习平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body class="register-page">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <div class="navbar-logo-icon">🤖</div>
        <span>ML智能学习</span>
      </a>
    </div>
  </nav>

  <!-- 注册容器 -->
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h1>欢迎加入</h1>
        <p>创建账号，开始你的机器学习之旅</p>
      </div>

      <form class="register-form" id="registerForm">
        <div class="form-group">
          <label class="form-label" for="username">账号</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="请输入账号（至少3个字符）"
            autocomplete="username"
          >
          <div class="form-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="请输入密码（至少6个字符）"
            autocomplete="new-password"
          >
          <div class="form-error" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">确认密码</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-input"
            placeholder="请再次输入密码"
            autocomplete="new-password"
          >
          <div class="form-error" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">
          注册并开始
        </button>
      </form>

      <div class="register-footer">
        <p>已有账号？<a href="index.html">直接进入首页</a></p>
      </div>
    </div>
  </div>

  <!-- 脚本 -->
  <script src="scripts/localStorage.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/register.js"></script>
</body>
</html>
