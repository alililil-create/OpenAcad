<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录/注册 - 机器学习个性化智能学习平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body class="register-page">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <div class="navbar-logo-icon">🤖</div>
        <span>ML智能学习</span>
      </a>
    </div>
  </nav>

  <!-- 注册/登录容器 -->
  <div class="register-container">
    <div class="register-card">
      <!-- 切换标签 -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">注册</button>
      </div>

      <div class="register-header" id="authHeader">
        <h1>欢迎回来</h1>
        <p>登录你的账号，继续学习之旅</p>
      </div>

      <form class="register-form" id="registerForm">
        <div class="form-group">
          <label class="form-label" for="username">账号</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="请输入账号"
            autocomplete="username"
          >
          <div class="form-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div style="position: relative;">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="请输入密码"
              autocomplete="current-password"
              style="padding-right: 44px;"
            >
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-secondary); padding: 4px; line-height: 1;">👁️</button>
          </div>
          <div class="form-error" id="passwordError"></div>
        </div>

        <div class="form-group" id="confirmGroup">
          <label class="form-label" for="confirmPassword">确认密码</label>
          <div style="position: relative;">
            <input
              type="password"
              id="confirmPassword"
              class="form-input"
              placeholder="请再次输入密码"
              autocomplete="new-password"
              style="padding-right: 44px;"
            >
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-secondary); padding: 4px; line-height: 1;">👁️</button>
          </div>
          <div class="form-error" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
          登录
        </button>
      </form>

      <div class="register-footer" id="authFooter">
        <p>还没有账号？<a href="#" onclick="switchTab('register')">立即注册</a></p>
      </div>
    </div>
  </div>

  <!-- 脚本 -->
  <script src="scripts/localStorage.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/register.js"></script>
</body>
</html>
